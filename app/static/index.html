<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turium AI Knowledge Inbox</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (Production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Marked for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    .prose p { margin-bottom: 0.75rem; }
    .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .prose strong { color: #0f172a; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ==========================================
    // API Client Helper
    // ==========================================
    const API_BASE = window.location.origin;

    async function apiRequest(endpoint, options = {}) {
      const url = `${API_BASE}${endpoint}`;
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      };

      const res = await fetch(url, { ...options, headers });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        const errorMsg = data?.error?.message || data?.detail || `HTTP ${res.status} Error`;
        throw new Error(errorMsg);
      }
      return data;
    }

    // ==========================================
    // Main App Component
    // ==========================================
    function App() {
      // System & Items State
      const [health, setHealth] = useState(null);
      const [items, setItems] = useState([]);
      const [totalItems, setTotalItems] = useState(0);
      const [loadingItems, setLoadingItems] = useState(false);
      const [selectedItemDetail, setSelectedItemDetail] = useState(null);

      // Ingestion Form State
      const [ingestTab, setIngestTab] = useState('note'); // 'note' | 'url'
      const [noteTitle, setNoteTitle] = useState('');
      const [noteContent, setNoteContent] = useState('');
      const [urlInput, setUrlInput] = useState('');
      const [urlTitle, setUrlTitle] = useState('');
      const [isIngesting, setIsIngesting] = useState(false);
      const [ingestMessage, setIngestMessage] = useState(null); // { type: 'success' | 'error', text }

      // Query State
      const [queryText, setQueryText] = useState('');
      const [topK, setTopK] = useState(4);
      const [isQuerying, setIsQuerying] = useState(false);
      const [queryResult, setQueryResult] = useState(null);
      const [queryError, setQueryError] = useState(null);
      const [queryHistory, setQueryHistory] = useState([]);

      // Item search filter
      const [searchFilter, setSearchFilter] = useState('');

      // Fetch health & stats
      const fetchHealth = useCallback(async () => {
        try {
          const data = await apiRequest('/health');
          setHealth(data);
        } catch (e) {
          console.error("Health check failed:", e);
        }
      }, []);

      // Fetch items list
      const fetchItems = useCallback(async () => {
        setLoadingItems(true);
        try {
          const data = await apiRequest('/items?limit=100');
          setItems(data.items || []);
          setTotalItems(data.total || 0);
        } catch (e) {
          console.error("Failed to fetch items:", e);
        } finally {
          setLoadingItems(false);
        }
      }, []);

      useEffect(() => {
        fetchHealth();
        fetchItems();
      }, [fetchHealth, fetchItems]);

      // Ingest Handler
      const handleIngest = async (e) => {
        e.preventDefault();
        setIngestMessage(null);
        setIsIngesting(true);

        try {
          let payload;
          if (ingestTab === 'note') {
            if (!noteContent.trim()) throw new Error("Note content cannot be empty.");
            payload = {
              type: 'note',
              title: noteTitle.trim() || undefined,
              content: noteContent.trim(),
            };
          } else {
            if (!urlInput.trim()) throw new Error("Please enter a valid URL.");
            payload = {
              type: 'url',
              title: urlTitle.trim() || undefined,
              content: urlInput.trim(),
            };
          }

          const result = await apiRequest('/ingest', {
            method: 'POST',
            body: JSON.stringify(payload),
          });

          setIngestMessage({
            type: 'success',
            text: `Successfully ingested "${result.title}" (${result.chunk_count} chunks generated).`,
          });

          // Reset inputs
          if (ingestTab === 'note') {
            setNoteTitle('');
            setNoteContent('');
          } else {
            setUrlInput('');
            setUrlTitle('');
          }

          // Refresh list & stats
          fetchItems();
          fetchHealth();
        } catch (err) {
          setIngestMessage({ type: 'error', text: err.message });
        } finally {
          setIsIngesting(false);
        }
      };

      // Delete Handler
      const handleDeleteItem = async (itemId, title) => {
        if (!confirm(`Are you sure you want to delete "${title}"?`)) return;
        try {
          await apiRequest(`/items/${itemId}`, { method: 'DELETE' });
          fetchItems();
          fetchHealth();
          if (selectedItemDetail?.id === itemId) {
            setSelectedItemDetail(null);
          }
        } catch (err) {
          alert(`Failed to delete: ${err.message}`);
        }
      };

      // View Item Chunks Detail
      const handleViewDetail = async (itemId) => {
        try {
          const detail = await apiRequest(`/items/${itemId}`);
          setSelectedItemDetail(detail);
        } catch (err) {
          alert(`Failed to load details: ${err.message}`);
        }
      };

      // Query Submission
      const handleQuery = async (queryToRun) => {
        const q = (typeof queryToRun === 'string' ? queryToRun : queryText).trim();
        if (!q) return;

        setQueryError(null);
        setIsQuerying(true);
        setQueryText(q);

        try {
          const res = await apiRequest('/query', {
            method: 'POST',
            body: JSON.stringify({
              query: q,
              top_k: topK,
            }),
          });
          setQueryResult(res);
          setQueryHistory(prev => [q, ...prev.filter(x => x !== q)].slice(0, 5));
        } catch (err) {
          setQueryError(err.message);
        } finally {
          setIsQuerying(false);
        }
      };

      // Filtered items
      const filteredItems = useMemo(() => {
        if (!searchFilter.trim()) return items;
        const s = searchFilter.toLowerCase();
        return items.filter(
          i => i.title.toLowerCase().includes(s) || i.content_preview.toLowerCase().includes(s) || (i.url && i.url.toLowerCase().includes(s))
        );
      }, [items, searchFilter]);

      // Sample Demo Ingestion Helper
      const loadDemoNote = () => {
        setIngestTab('note');
        setNoteTitle('Turium Architecture & RAG Pipeline');
        setNoteContent(
          `Turium is designed to deliver minimalist, high-impact AI knowledge tools without enterprise bloat.\n\n` +
          `Key Architecture Components:\n` +
          `1. Intentional Recursive Chunking: Breaks text hierarchically on paragraph and sentence boundaries (target size: 500 characters, overlap: 100 characters).\n` +
          `2. Persistent SQLite Vector Store: Embeddings are stored directly in SQLite alongside document metadata. Cosine similarity is computed with sub-millisecond latency via optimized NumPy matrix dot products.\n` +
          `3. Grounded Retrieval-Augmented Generation: Top-k relevant chunks are retrieved and injected into a strict system prompt that mandates direct source citation (e.g. [Source 1], [Source 2]).\n` +
          `4. Dual Fallback Mode: Seamlessly supports cloud models (OpenAI text-embedding-3-small & gpt-4o-mini, or Gemini text-embedding-004 & gemini-2.5-flash) with an offline deterministic fallback.`
        );
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Top Navigation Bar */}
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-200">
                  T
                </div>
                <div>
                  <h1 class="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    Turium AI Knowledge Inbox
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">v1.0</span>
                  </h1>
                  <p class="text-xs text-slate-500">Minimalist Semantic Ingestion & RAG Question Answering</p>
                </div>
              </div>

              {/* Status & Health Indicators */}
              <div class="flex items-center flex-wrap gap-2 text-xs">
                {health && (
                  <>
                    <div class="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200 rounded-md text-emerald-700 font-medium">
                      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      Online
                    </div>
                    <div class="px-2.5 py-1 bg-slate-100 border border-slate-200 rounded-md text-slate-700 font-medium">
                      Provider: <span class="font-semibold uppercase text-indigo-600">{health.provider}</span>
                    </div>
                    <div class="px-2.5 py-1 bg-slate-100 border border-slate-200 rounded-md text-slate-600">
                      Saved: <strong class="text-slate-900">{totalItems}</strong> items ({health.chunks_count} chunks)
                    </div>
                  </>
                )}
                <a
                  href="/docs"
                  target="_blank"
                  rel="noreferrer"
                  class="px-2.5 py-1 bg-slate-800 text-white font-medium rounded-md hover:bg-slate-700 transition"
                >
                  Swagger Docs &rarr;
                </a>
              </div>
            </div>
          </header>

          {/* Main Grid Content */}
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

            {/* LEFT COLUMN: Ingestion & Saved Items (5 cols) */}
            <div class="lg:col-span-5 space-y-6">

              {/* Ingestion Card */}
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                  <h2 class="font-bold text-slate-900 flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Save to Knowledge Inbox
                  </h2>
                  <button
                    onClick={loadDemoNote}
                    type="button"
                    class="text-xs text-indigo-600 hover:text-indigo-800 font-medium underline"
                  >
                    + Load Demo Note
                  </button>
                </div>

                {/* Tabs */}
                <div class="flex p-1 bg-slate-100 rounded-lg mb-4 text-xs font-semibold">
                  <button
                    onClick={() => { setIngestTab('note'); setIngestMessage(null); }}
                    class={`flex-1 py-1.5 rounded-md transition ${ingestTab === 'note' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    📝 Text Note
                  </button>
                  <button
                    onClick={() => { setIngestTab('url'); setIngestMessage(null); }}
                    class={`flex-1 py-1.5 rounded-md transition ${ingestTab === 'url' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    🌐 Web URL
                  </button>
                </div>

                {/* Ingestion Form */}
                <form onSubmit={handleIngest} class="space-y-3.5">
                  {ingestTab === 'note' ? (
                    <>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Title (Optional)</label>
                        <input
                          type="text"
                          value={noteTitle}
                          onChange={(e) => setNoteTitle(e.target.value)}
                          placeholder="e.g. Architecture Principles"
                          class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                        />
                      </div>
                      <div>
                        <div class="flex justify-between items-center mb-1">
                          <label class="text-xs font-semibold text-slate-700">Content (Plain text)</label>
                          <span class="text-[10px] text-slate-400">{noteContent.length} chars</span>
                        </div>
                        <textarea
                          rows="4"
                          value={noteContent}
                          onChange={(e) => setNoteContent(e.target.value)}
                          placeholder="Paste notes, thoughts, technical snippets, or meeting summaries..."
                          required
                          class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none leading-relaxed"
                        ></textarea>
                      </div>
                    </>
                  ) : (
                    <>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Web Page URL</label>
                        <input
                          type="url"
                          value={urlInput}
                          onChange={(e) => setUrlInput(e.target.value)}
                          placeholder="https://en.wikipedia.org/wiki/Retrieval-augmented_generation"
                          required
                          class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                        />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Custom Title (Optional)</label>
                        <input
                          type="text"
                          value={urlTitle}
                          onChange={(e) => setUrlTitle(e.target.value)}
                          placeholder="Leave blank to auto-extract from HTML <title>"
                          class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                        />
                      </div>
                      <p class="text-[11px] text-slate-500 bg-slate-50 p-2 rounded border border-slate-200">
                        ⚡ The server fetches and sanitizes the page HTML, strips scripts and boilerplate, and generates semantic chunks.
                      </p>
                    </>
                  )}

                  {/* Feedback Message */}
                  {ingestMessage && (
                    <div class={`p-2.5 rounded-lg text-xs ${ingestMessage.type === 'success' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`}>
                      {ingestMessage.text}
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={isIngesting}
                    class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg shadow-sm transition disabled:opacity-50 flex items-center justify-center gap-2"
                  >
                    {isIngesting ? (
                      <>
                        <svg class="animate-spin h-3.5 w-3.5 text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <span>Processing & Chunking...</span>
                      </>
                    ) : (
                      <>
                        <span>Ingest & Index Content</span>
                        <span>&rarr;</span>
                      </>
                    )}
                  </button>
                </form>
              </div>

              {/* Saved Items List */}
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="font-bold text-slate-900 flex items-center gap-2 text-sm">
                    <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Saved Items ({totalItems})
                  </h2>
                  <button
                    onClick={fetchItems}
                    class="text-xs text-slate-500 hover:text-slate-800 transition"
                    title="Refresh list"
                  >
                    🔄
                  </button>
                </div>

                {/* Filter Input */}
                <div class="mb-3">
                  <input
                    type="text"
                    value={searchFilter}
                    onChange={(e) => setSearchFilter(e.target.value)}
                    placeholder="Search saved items..."
                    class="w-full text-xs px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-md focus:bg-white focus:ring-1 focus:ring-indigo-500 outline-none"
                  />
                </div>

                {/* List items */}
                {loadingItems ? (
                  <div class="py-8 text-center text-xs text-slate-400">Loading inbox items...</div>
                ) : filteredItems.length === 0 ? (
                  <div class="py-8 text-center text-xs text-slate-400 border border-dashed border-slate-200 rounded-lg">
                    {searchFilter ? "No items matching your filter." : "Your knowledge inbox is empty. Ingest notes or URLs above!"}
                  </div>
                ) : (
                  <div class="space-y-2.5 max-h-[440px] overflow-y-auto pr-1">
                    {filteredItems.map(item => (
                      <div
                        key={item.id}
                        class="p-3 rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-slate-50 transition group"
                      >
                        <div class="flex items-start justify-between gap-2">
                          <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 mb-1">
                              <span class={`text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ${item.source_type === 'url' ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'}`}>
                                {item.source_type}
                              </span>
                              <h3 class="text-xs font-semibold text-slate-900 truncate" title={item.title}>
                                {item.title}
                              </h3>
                            </div>
                            {item.url && (
                              <a
                                href={item.url}
                                target="_blank"
                                rel="noreferrer"
                                class="text-[11px] text-indigo-600 hover:underline truncate block mb-1"
                              >
                                {item.url}
                              </a>
                            )}
                            <p class="text-[11px] text-slate-500 line-clamp-2 leading-relaxed">
                              {item.content_preview}
                            </p>
                            <div class="flex items-center gap-2 mt-2 text-[10px] text-slate-400">
                              <span>{item.chunk_count} chunk{item.chunk_count !== 1 ? 's' : ''}</span>
                              <span>•</span>
                              <span>{item.word_count} words</span>
                              <span>•</span>
                              <span>{new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                          </div>
                          <div class="flex flex-col items-end gap-1 opacity-80 group-hover:opacity-100">
                            <button
                              onClick={() => handleViewDetail(item.id)}
                              class="text-[10px] px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition"
                              title="Inspect chunks"
                            >
                              Chunks
                            </button>
                            <button
                              onClick={() => handleDeleteItem(item.id, item.title)}
                              class="text-[10px] px-2 py-0.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded transition"
                              title="Delete item"
                            >
                              Delete
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* RIGHT COLUMN: RAG Q&A Interface & Results (7 cols) */}
            <div class="lg:col-span-7 space-y-6">

              {/* Ask Question Box */}
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                  <h2 class="font-bold text-slate-900 flex items-center gap-2 text-sm">
                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                    Ask Knowledge Inbox
                  </h2>
                  <div class="flex items-center gap-2 text-xs">
                    <label class="text-slate-500">Top-k Chunks:</label>
                    <select
                      value={topK}
                      onChange={(e) => setTopK(Number(e.target.value))}
                      class="text-xs bg-slate-50 border border-slate-200 rounded px-2 py-0.5 font-medium outline-none"
                    >
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                      <option value="6">6</option>
                    </select>
                  </div>
                </div>

                {/* Question Input */}
                <form
                  onSubmit={(e) => { e.preventDefault(); handleQuery(); }}
                  class="space-y-3"
                >
                  <div class="relative">
                    <textarea
                      rows="3"
                      value={queryText}
                      onChange={(e) => setQueryText(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                          e.preventDefault();
                          handleQuery();
                        }
                      }}
                      placeholder="Ask anything over your saved notes or URLs (e.g. 'What is the chunking strategy?' or 'Summarize my notes')..."
                      class="w-full text-xs px-3.5 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none leading-relaxed"
                    ></textarea>
                    <div class="absolute right-2.5 bottom-2.5 text-[10px] text-slate-400">
                      Press Ctrl+Enter
                    </div>
                  </div>

                  {/* Suggestion Chips */}
                  <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-500">
                    <span class="text-[11px] font-medium text-slate-400">Suggestions:</span>
                    <button
                      type="button"
                      onClick={() => handleQuery("What is Turium's chunking strategy and rationale?")}
                      class="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full transition"
                    >
                      Chunking Strategy?
                    </button>
                    <button
                      type="button"
                      onClick={() => handleQuery("What vector store is used and what are the trade-offs?")}
                      class="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full transition"
                    >
                      Vector Store Tradeoffs?
                    </button>
                    <button
                      type="button"
                      onClick={() => handleQuery("What breaks at scale?")}
                      class="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full transition"
                    >
                      What breaks at scale?
                    </button>
                  </div>

                  {queryError && (
                    <div class="p-2.5 bg-rose-50 border border-rose-200 rounded-lg text-xs text-rose-800">
                      Error: {queryError}
                    </div>
                  )}

                  <div class="flex justify-end">
                    <button
                      type="submit"
                      disabled={isQuerying || !queryText.trim()}
                      class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg shadow-sm transition disabled:opacity-50 flex items-center gap-2"
                    >
                      {isQuerying ? (
                        <>
                          <svg class="animate-spin h-3.5 w-3.5 text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                          <span>Searching & Generating...</span>
                        </>
                      ) : (
                        <>
                          <span>Ask Question</span>
                          <span>&rarr;</span>
                        </>
                      )}
                    </button>
                  </div>
                </form>
              </div>

              {/* Answer & Citations Card */}
              {queryResult && (
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
                  {/* Result Header */}
                  <div class="flex flex-wrap items-center justify-between pb-3 border-b border-slate-100 gap-2">
                    <div class="text-xs font-semibold text-slate-800 flex items-center gap-2">
                      <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                      Answer Generated
                    </div>
                    <div class="flex items-center gap-2 text-[11px] text-slate-500">
                      <span class="px-2 py-0.5 bg-slate-100 rounded text-slate-700 font-mono">
                        {queryResult.latency_ms} ms
                      </span>
                      <span class="px-2 py-0.5 bg-slate-100 rounded text-slate-700">
                        Model: <strong class="text-slate-900">{queryResult.model}</strong>
                      </span>
                      <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded font-medium">
                        {queryResult.retrieval_count} Sources Retrieved
                      </span>
                    </div>
                  </div>

                  {/* Rendered Answer Markdown */}
                  <div class="prose prose-sm max-w-none text-slate-800 text-xs leading-relaxed bg-slate-50/70 p-4 rounded-lg border border-slate-200/80">
                    <div dangerouslySetInnerHTML={{ __html: marked.parse(queryResult.answer) }} />
                  </div>

                  {/* Cited Sources & Snippets */}
                  {queryResult.sources && queryResult.sources.length > 0 && (
                    <div class="space-y-3 pt-2">
                      <h3 class="text-xs font-bold text-slate-900 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        Retrieved Context Sources ({queryResult.sources.length})
                      </h3>
                      <div class="grid grid-cols-1 gap-2.5">
                        {queryResult.sources.map((src, idx) => (
                          <div
                            key={src.chunk_id || idx}
                            class="p-3 bg-white rounded-lg border border-slate-200 shadow-2xs hover:border-slate-300 transition"
                          >
                            <div class="flex items-center justify-between gap-2 mb-1.5">
                              <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-900">
                                <span class="px-1.5 py-0.5 bg-indigo-100 text-indigo-700 rounded text-[10px] font-bold">
                                  Source {idx + 1}
                                </span>
                                <span class="truncate max-w-xs">{src.source_title}</span>
                                <span class="text-[10px] text-slate-400">({src.source_type})</span>
                              </div>
                              <div class="flex items-center gap-1.5">
                                <span class="text-[10px] text-slate-500 font-mono">
                                  Similarity: {(src.similarity_score * 100).toFixed(1)}%
                                </span>
                                <div class="w-12 bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                  <div
                                    class="bg-indigo-600 h-full rounded-full"
                                    style={{ width: `${Math.min(100, Math.max(0, src.similarity_score * 100))}%` }}
                                  ></div>
                                </div>
                              </div>
                            </div>
                            <p class="text-[11px] text-slate-600 leading-relaxed font-mono bg-slate-50 p-2 rounded border border-slate-100">
                              "{src.snippet}"
                            </p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Query History */}
              {queryHistory.length > 0 && (
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                  <h3 class="text-xs font-bold text-slate-700 mb-2">Recent Questions</h3>
                  <div class="flex flex-wrap gap-2">
                    {queryHistory.map((q, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleQuery(q)}
                        class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 px-2.5 py-1 rounded-md transition text-left"
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>

          </main>

          {/* Item Chunks Modal / Drawer */}
          {selectedItemDetail && (
            <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-200">
                <div class="p-5 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 mr-2">
                      {selectedItemDetail.source_type}
                    </span>
                    <h3 class="text-sm font-bold text-slate-900 inline">{selectedItemDetail.title}</h3>
                    <p class="text-xs text-slate-500 mt-0.5">
                      {selectedItemDetail.char_count} chars • {selectedItemDetail.chunk_count} semantic chunks
                    </p>
                  </div>
                  <button
                    onClick={() => setSelectedItemDetail(null)}
                    class="text-slate-400 hover:text-slate-600 text-lg font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                <div class="p-5 overflow-y-auto space-y-4 text-xs">
                  <div>
                    <h4 class="font-bold text-slate-800 mb-1">Generated Chunks & Offsets</h4>
                    <p class="text-[11px] text-slate-500 mb-3">
                      Each chunk preserves semantic boundaries with sliding character overlaps.
                    </p>
                    <div class="space-y-3">
                      {selectedItemDetail.chunks?.map(c => (
                        <div key={c.id} class="p-3 bg-slate-50 border border-slate-200 rounded-lg">
                          <div class="flex justify-between items-center text-[10px] text-slate-500 mb-1 font-mono">
                            <span>Chunk #{c.chunk_index}</span>
                            <span>Offsets: [{c.char_start}..{c.char_end}] ({c.char_end - c.char_start} chars)</span>
                          </div>
                          <p class="text-xs text-slate-800 font-mono leading-relaxed whitespace-pre-wrap">
                            {c.content}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div class="pt-4 border-t border-slate-200">
                    <h4 class="font-bold text-slate-800 mb-1">Raw Extracted Content</h4>
                    <pre class="bg-slate-900 text-slate-100 p-3 rounded-lg text-[11px] overflow-x-auto whitespace-pre-wrap leading-relaxed max-h-48">
                      {selectedItemDetail.raw_content}
                    </pre>
                  </div>
                </div>

                <div class="p-4 bg-slate-50 border-t border-slate-200 rounded-b-2xl flex justify-end">
                  <button
                    onClick={() => setSelectedItemDetail(null)}
                    class="px-4 py-1.5 bg-slate-800 text-white font-semibold text-xs rounded-lg hover:bg-slate-700 transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
            Turium AI Interview Assignment • Built with FastAPI, SQLite Vector Store, and React
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
